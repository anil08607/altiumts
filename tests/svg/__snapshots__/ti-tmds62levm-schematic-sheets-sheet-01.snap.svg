    <g data-record="28"><defs><clipPath id="altium-text-frame-UBSZWHLP"><rect x="222.5" y="762.5" width="250" height="20"/></clipPath></defs><text x="223" y="772.6" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="9.6" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-UBSZWHLP)"><tspan x="223" dy="0">Recommendations</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-QZDYVISA"><rect x="502.5" y="432.5" width="260" height="70"/></clipPath></defs><text x="503" y="442.6" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="9.6" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-QZDYVISA)"><tspan x="503" dy="0">We have customer requesting for Altium files</tspan><tspan x="503" dy="9.6">and using the .ALG files. The .ALG file is</tspan><tspan x="503" dy="9.6">an intermediate converted file</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-QRGTJQXI"><rect x="502.5" y="482.5" width="260" height="70"/></clipPath></defs><text x="503" y="492.6" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="9.6" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-QRGTJQXI)"><tspan x="503" dy="0">The Altium converted schematics and PCB</tspan><tspan x="503" dy="9.6">files provided has most of the constraints</tspan><tspan x="503" dy="9.6">translated and close the Orcad/Allegro</tspan><tspan x="503" dy="9.6">design files</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-GWZJKZKJ"><rect x="502.5" y="542.5" width="260" height="30"/></clipPath></defs><text x="503" y="552.6" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="9.6" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-GWZJKZKJ)"><tspan x="503" dy="0">schematic, layout , footprint review</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-PLJSUCKK"><rect x="502.5" y="582.5" width="260" height="30"/></clipPath></defs><text x="503" y="592.6" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="9.6" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-PLJSUCKK)"><tspan x="503" dy="0">The simulations have been performed on</tspan><tspan x="503" dy="9.6">Orcad/Allegro design files</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-AUQLVQKB"><rect x="502.5" y="622.5" width="260" height="40"/></clipPath></defs><text x="503" y="632.6" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="9.6" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-AUQLVQKB)"><tspan x="503" dy="0">Refer to</tspan><tspan x="503" dy="9.6">Proc180E1-1_Altium_Folders_Files_List</tspan><tspan x="503" dy="9.6">document in the download Zip file</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-DKWWXPOE"><rect x="500.5" y="677.5" width="260" height="70"/></clipPath></defs><text x="501" y="687.6" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="9.6" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-DKWWXPOE)"><tspan x="501" dy="0">The required reviews for the converted files</tspan><tspan x="501" dy="9.6">have been provided. The boards have not been</tspan><tspan x="501" dy="9.6">built and tested. Orcad/Allegro design-based</tspan><tspan x="501" dy="9.6">boards have been built and tested.</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-DJTAIBER"><rect x="502.5" y="752.5" width="260" height="70"/></clipPath></defs><text x="503" y="762.6" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="9.6" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-DJTAIBER)"><tspan x="503" dy="0">Customer can use the files to make the</tspan><tspan x="503" dy="9.6">required updates. The recommendation is for</tspan><tspan x="503" dy="9.6">customer to perform a detailed review to</tspan><tspan x="503" dy="9.6">ensure there are no errors before start of</tspan><tspan x="503" dy="9.6">board builds</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-PUIJZZFO"><rect x="532.5" y="332.5" width="260" height="20"/></clipPath></defs><text x="533" y="342.6" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="9.6" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-PUIJZZFO)"><tspan x="533" dy="0">Comments</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-GWSOAMNP"><rect x="232.5" y="322.5" width="260" height="20"/></clipPath></defs><text x="233" y="332.6" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="9.6" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-GWSOAMNP)"><tspan x="233" dy="0">Queries and Notes</tspan></text></g>
