    <g data-record="28"><defs><clipPath id="altium-text-frame-WDACUCLV"><rect x="502.5" y="372.5" width="260" height="70"/></clipPath></defs><text x="503" y="382.6" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="9.6" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-WDACUCLV)"><tspan x="503" dy="0">AM62L EVM design files on TI.com have been</tspan><tspan x="503" dy="9.6">used for converting the Orcad/Allegro design</tspan><tspan x="503" dy="9.6">to Altium design files</tspan></text></g>
