    <g data-record="28"><defs><clipPath id="altium-text-frame-KWIYGLCO"><rect x="222.5" y="482.5" width="250" height="20"/></clipPath></defs><text x="223" y="492.6" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="9.6" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-KWIYGLCO)"><tspan x="223" dy="0">Altium converted files</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-PSKYVZQQ"><rect x="222.5" y="542.5" width="250" height="10"/></clipPath></defs><text x="223" y="552.6" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="9.6" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-PSKYVZQQ)"><tspan x="223" dy="0">Reviews completed</tspan></text></g>
